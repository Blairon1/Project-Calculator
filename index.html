<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title"></div>
    <div class="container">
        <div class="calculator">
            <div class="top-section">
                <div class="display">0</div>
            </div>
            <div class="bottom-section">
                <div class="numpad">
                    <div class="num">7</div>
                    <div class="num">8</div>
                    <div class="num">9</div>
                    <div class="num-/" id="divide" style="background-color: palevioletred;" >/</div>

                    <div class="num">4</div>
                    <div class="num">5</div>
                    <div class="num">6</div>
                    <div class="num-X" id="mult" style="background-color: palevioletred;" >X</div>

                    <div class="num">1</div>
                    <div class="num">2</div>
                    <div class="num">3</div>
                    <div class="num--" id="sub" style="background-color: palevioletred;">-</div>

                    <div class="num">0</div>
                    <div class="num-clear" id="clear">Ce</div>
                    <div class="num-=" id="equal">=</div>
                    <div class="num-+" id="addition" style="background-color: palevioletred;">+</div>
                </div>
            </div>

        </div>
    </div>
    <div class="footer"></div>
    
</body>
</html>
